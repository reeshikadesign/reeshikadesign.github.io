<!DOCTYPE html>
<html>
<head>
  <title>Reeshika Kabir</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Animated background */
    .bg {
      position: fixed;
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, #111, #1a1a2e, #0f3460, #16213e);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
      z-index: -1;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-direction: column;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 60px;
      margin: 0;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      color: #cfcfcf;
      margin-top: 10px;
    }

    .buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    .primary {
      background: white;
      color: black;
    }

    .primary:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    .secondary {
      border: 1px solid white;
      color: white;
    }

    .secondary:hover {
      background: white;
      color: black;
      transform: scale(1.1);
    }

    /* floating effect */
    .floating {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="container floating">
    <h1>Reeshika Kabir</h1>
<p>Graphic Designer • Creative Visual Work</p>
    <div class="buttons">
      <a href="portfolio.html" class="btn primary">View Portfolio</a>
      <a href="#" class="btn secondary">Contact</a>
    </div>
  </div>

</body>
</html>
