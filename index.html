<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reeshika Kabir</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    color:#111;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 25% 30%,
    rgba(255,0,221,.45),
    transparent 25%),

    radial-gradient(circle at 80% 20%,
    rgba(255,230,0,.40),
    transparent 30%),

    radial-gradient(circle at 65% 70%,
    rgba(255,140,0,.30),
    transparent 35%),

    #ffffff;
}

/* HERO */

.hero{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-left:10%;
}

.hero h1{
    font-size:8rem;
    line-height:.9;
    font-weight:500;
}

.subtitle{
    margin-top:20px;
    font-size:1.5rem;
    color:#444;
}

.portfolio-link{
    margin-top:18px;
    text-decoration:none;
    color:#111;
    font-size:1.3rem;
    width:fit-content;
    transition:.3s;
}

.portfolio-link:hover{
    transform:translateX(8px);
}

/* SECTION */

section{
    padding:40px 10%;
}

.section-title{
    font-size:3rem;
    margin-bottom:40px;
}

.about-text{
    max-width:750px;
    font-size:1.1rem;
    line-height:1.9;
    color:#444;
}

/* CONTACT */

.contact-container{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.contact-item{
    font-size:1.2rem;
}

.contact-item a{
    color:#111;
    text-decoration:none;
}

.contact-item a:hover{
    text-decoration:underline;
}

/* FOOTER */

footer{
    padding:50px;
    text-align:center;
    color:#666;
}

/* MOBILE */

@media(max-width:768px){

.hero{
    padding:40px;
}

.hero h1{
    font-size:4.5rem;
}

.section-title{
    font-size:2rem;
}

}

</style>
</head>
<body>

<div class="hero">

    <h1>
        Reeshika<br>
        Kabir
    </h1>

    <p class="subtitle">
        Graphic Designer
    </p>

    <a href="portfolio.html" class="portfolio-link">
        Portfolio →
    </a>

</div>

<section id="about">

...

</section>

<section id="contact">

...

</section>

</section>

<footer>
    © 2026 Reeshika Kabir
</footer>

</body>
</html>
