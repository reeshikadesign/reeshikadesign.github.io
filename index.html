<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reeshika Kabir</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
}

.container{
    width:1000px;
    height:600px;
    background:white;
    position:relative;
    overflow:hidden;
    border:2px solid #222;
}

/* Top line */
.top-info{
    position:absolute;
    top:35px;
    left:70px;
    font-size:20px;
    color:#555;
}

.top-info span{
    margin-right:25px;
}

/* Gradient shape */
.gradient-blob{
    position:absolute;
    width:700px;
    height:700px;
    top:-120px;
    left:260px;
    background:
        radial-gradient(circle at 30% 40%, rgba(255,0,200,0.55), transparent 40%),
        radial-gradient(circle at 70% 35%, rgba(255,220,0,0.45), transparent 45%),
        radial-gradient(circle at 60% 70%, rgba(255,180,0,0.35), transparent 45%);
    filter: blur(40px);
}

/* Name */
.name{
    position:absolute;
    left:90px;
    top:180px;
    z-index:2;
}

.name h1{
    font-size:72px;
    line-height:0.95;
    font-weight:500;
    color:#222;
}

.name p{
    margin-top:20px;
    font-size:24px;
    color:#444;
}

/* Divider line */
.divider{
    position:absolute;
    top:50%;
    width:100%;
    border-top:1px solid #cfcfcf;
}

/* Vertical portfolio */
.portfolio-link{
    position:absolute;
    right:40px;
    top:50%;
    transform:translateY(-50%) rotate(90deg);
    text-decoration:none;
    z-index:3;
}

.portfolio-link h2{
    font-size:130px;
    font-weight:900;
    color:#111;
    letter-spacing:2px;
    transition:0.3s;
}

.portfolio-link:hover h2{
    transform:scale(1.03);
}
</style>
</head>
<body>

<div class="container">

    <div class="gradient-blob"></div>

    <div class="top-info">
        <span>Graphic Designer ↗</span>
    </div>

    <div class="name">
        <h1>Reeshika<br>Kabir</h1>
    </div>

    <div class="divider"></div>

    <a href="portfolio.html" class="portfolio-link">
        <h2>Portfolio</h2>
    </a>

</div>

</body>
</html>
