<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Reeshika Kabir</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:
    radial-gradient(circle at 20% 25%,
    rgba(255,0,221,.35),
    transparent 25%),

    radial-gradient(circle at 80% 15%,
    rgba(255,230,0,.35),
    transparent 30%),

    radial-gradient(circle at 70% 80%,
    rgba(255,140,0,.25),
    transparent 35%),

    white;

    min-height:100vh;
}

/* HEADER */

.header{
    padding:60px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:4rem;
    font-weight:500;
}

.home-link{
    text-decoration:none;
    color:#111;
    font-size:1.1rem;
}

/* GALLERY GRID */

.gallery{
    padding:0 10% 100px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:30px;
}

/* PROJECT CARD */

.project{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s ease;
}

.project:hover{
    transform:translateY(-6px);
}

/* IMAGE (works for landscape + portrait) */

.project img{
    width:100%;
    height:auto;
    display:block;
    transition:.4s ease;
}

.project:hover img{
    transform:scale(1.03);
}

/* TEXT */

.project-info{
    padding:18px 20px;
}

.project-info h3{
    margin-bottom:8px;
    font-size:1.1rem;
}

.project-info p{
    color:#666;
    line-height:1.6;
    font-size:0.95rem;
}

/* MOBILE */

@media(max-width:768px){

.header{
    flex-direction:column;
    gap:15px;
    align-items:flex-start;
}

.header h1{
    font-size:2.8rem;
}

.gallery{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Portfolio</h1>
    <a href="index.html" class="home-link">← Home</a>
</div>

<!-- GALLERY -->
<div class="gallery">

    <!-- PROJECT 1 -->
    <div class="project">
        <img src="images/design1.jpg" alt="Design 1">
        <div class="project-info">
            <h3>Project Title 1</h3>
            <p>Short description of the design.</p>
        </div>
    </div>

    <!-- PROJECT 2 -->
    <div class="project">
        <img src="images/design2.jpg" alt="Design 2">
        <div class="project-info">
            <h3>Project Title 2</h3>
            <p>Short description of the design.</p>
        </div>
    </div>

    <!-- PROJECT 3 -->
    <div class="project">
        <img src="images/design3.jpg" alt="Design 3">
        <div class="project-info">
            <h3>Project Title 3</h3>
            <p>Short description of the design.</p>
        </div>
    </div>

</div>

</body>
</html>
