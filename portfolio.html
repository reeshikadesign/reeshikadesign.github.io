<!DOCTYPE html>
<html>
<head>
  <title>Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      color: white;
      overflow-x: hidden;
      background: radial-gradient(circle at top, #0b0f2a, #05060f, #02030a);
    }

    /* 🌸 SAME PETALS SYSTEM */
    .petal {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      background: rgba(180, 200, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(180, 200, 255, 0.8),
                  0 0 24px rgba(120, 160, 255, 0.4);
      animation: fall linear infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(0px) translateX(0px);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) translateX(30px) rotate(360deg);
        opacity: 0;
      }
    }

    /* 🌙 LAYOUT (same vibe as homepage) */
    .container {
      max-width: 900px;
      margin: 80px auto;
      padding: 40px;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 50px;
      margin-bottom: 20px;
      text-shadow: 0 0 25px rgba(140,180,255,0.6);
    }

    /* 📦 PROJECT CARDS */
    .project {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 20px;
      margin-top: 20px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
      transition: 0.3s;
    }

    .project:hover {
      transform: scale(1.03);
      background: rgba(255,255,255,0.1);
    }

    a {
      color: white;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      opacity: 0.7;
    }

    .back:hover {
      opacity: 1;
    }

  </style>
</head>

<body>

  <!-- 🌸 SAME PETALS -->
  <div class="petal" style="left:5%; animation-duration: 8s;"></div>
  <div class="petal" style="left:15%; animation-duration: 10s;"></div>
  <div class="petal" style="left:25%; animation-duration: 6s;"></div>
  <div class="petal" style="left:35%; animation-duration: 9s;"></div>
  <div class="petal" style="left:50%; animation-duration: 7s;"></div>
  <div class="petal" style="left:65%; animation-duration: 11s;"></div>
  <div class="petal" style="left:80%; animation-duration: 8s;"></div>
  <div class="petal" style="left:92%; animation-duration: 12s;"></div>

  <!-- 🌙 CONTENT -->
  <div class="container">

    <a href="index.html" class="back">← Back Home</a>

    <h1>My Work</h1>

    <div class="project">
      <h3>NGO Recruitment Campaign</h3>
      <p>Designed and supported recruitment process for field operations.</p>
    </div>

    <div class="project">
      <h3>Community Awareness Posters</h3>
      <p>Created visuals for outreach programs using Photoshop.</p>
    </div>

    <div class="project">
      <h3>HR Interview Process</h3>
      <p>Conducted interviews and structured selection workflow.</p>
    </div>

  </div>

</body>
</html>
